[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre"
version = "0.1.0"
description = "Collaborative security intelligence, repository risk, and evidence automation platform"
requires-python = ">=3.11"
dependencies = [
  "aiobotocore>=2.13,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<24",
  "asyncpg>=0.29,<1",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "openpyxl>=3.1,<4",
  "pillow>=10.4,<12",
  "pillow-heif>=0.21,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "pydantic>=2.8,<3",
  "PyJWT>=2.9,<3",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "python-pptx>=1.0,<2",
  "pytesseract>=0.3.10,<0.4",
  "redis>=5.0,<6",
  "reportlab>=4.2,<5",
  "scrapling[fetchers]>=0.4.15,<0.5",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.2,<26",
  "tenacity>=8.5,<10",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
local-models = ["llama-cpp-python>=0.3.7,<1"]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
