[package]
name = "rust-crypto-service"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.7"
hex = "0.4"
jsonwebtoken = "9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["timeout", "trace", "limit", "request-id"] }
uuid = { version = "1", features = ["v4"] }
