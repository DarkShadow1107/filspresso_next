services:
    # -------------------------------------------------------------------------
    # 1. PostgreSQL  (pgvector + rdkit)
    # -------------------------------------------------------------------------
    postgres:
        build:
            context: .
            dockerfile: Dockerfile.db
        container_name: filspresso_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-filspresso}
            POSTGRES_USER: ${DB_USER:-filspresso_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-}
            POSTGRES_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./nestjs-backend/data:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-filspresso_user} -d ${DB_NAME:-filspresso}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # -------------------------------------------------------------------------
    # 2. Redis  (shared ops event storage)
    # -------------------------------------------------------------------------
    redis:
        image: redis:7.4-alpine
        container_name: filspresso_redis
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # -------------------------------------------------------------------------
    # 2b. OPA Policy Engine  (authorization control plane)
    # -------------------------------------------------------------------------
    opa:
        image: openpolicyagent/opa:0.66.0
        container_name: filspresso_opa
        restart: unless-stopped
        command:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --set=decision_logs.console=true
            - /policies
        ports:
            - "8181:8181"
        volumes:
            - ./security/opa/policies:/policies:ro
        healthcheck:
            test: ["CMD", "opa", "version"]
            interval: 20s
            timeout: 5s
            retries: 5

    # -------------------------------------------------------------------------
    # 3. Backend  (NestJS runtime)
    # -------------------------------------------------------------------------
    backend:
        build:
            context: .
            dockerfile: nestjs-backend/Dockerfile
        container_name: filspresso_backend
        restart: unless-stopped
        # Must exceed SHUTDOWN_TIMEOUT_MS (25s default) so Docker does not SIGKILL
        # the process while it is still draining in-flight requests.
        stop_grace_period: 40s
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            opa:
                condition: service_started
            rust_crypto:
                condition: service_started
            invoice_java:
                condition: service_started
            go_ops:
                condition: service_started
            kotlin_subscriptions:
                condition: service_started
        environment:
            NODE_ENV: ${NODE_ENV:-production}
            PORT: 4000
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: ${DB_NAME:-filspresso}
            DB_USER: ${DB_USER:-filspresso_user}
            DB_PASSWORD: ${DB_PASSWORD:-}
            DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
            BACKEND_DB_USER: ${BACKEND_DB_USER:-}
            BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:-}
            BACKEND_DB_PASSWORD_FILE: ${BACKEND_DB_PASSWORD_FILE:-}
            STRICT_SERVICE_DB_CREDENTIALS: ${STRICT_SERVICE_DB_CREDENTIALS:-false}
            # Phase 1 (PLAN_NESTJS_SCALING.md 3). argon2/bcrypt dispatch onto
            # libuv's threadpool, whose default is 4 threads, so ~20 concurrent
            # logins queue into ~5 waves of 50-150ms hashing. 16 keeps the login
            # tail latency roughly flat. Must be set before node starts: it is
            # read once at startup, so setting it at runtime has no effect.
            UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
            # Pool sizing is now configuration, and Phase 9 finally supplied the data
            # the old comment was waiting for. At DB_POOL_MAX=20 the 50-concurrent-user
            # load test (V3) pinned the pool at 20/20 with up to 17 callers queued for a
            # connection. That is structural, not a slow query: a request-scoped
            # connection means zero queueing at N concurrent users needs N connections.
            #
            # Budget: max_connections=100, minus 3 superuser-reserved, minus the handful
            # of admin/observability sessions, leaves ~90. One replica at 50 keeps ~40
            # spare, so this still satisfies "replicas x DB_POOL_MAX < max_connections"
            # with room for a second replica. Do not raise it without redoing that sum.
            DB_POOL_MAX: ${DB_POOL_MAX:-50}
            DB_POOL_MIN: ${DB_POOL_MIN:-2}
            DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
            # Phase 9. The per-IP rate limiter and the login-attempt lockout both key
            # on req.ip. Without this, every request arrives from the Docker gateway
            # and they all share ONE budget: the login limit is 10/15min, so the 11th
            # user on the whole instance gets a 429 and a single abusive client can
            # lock out everyone. `1` trusts exactly one hop, which is Caddy. The
            # published 4000 port means a direct host caller can still set XFF, but
            # that path is dev-only; remove the port mapping in production instead of
            # setting this to 0, which would re-break Caddy.
            TRUST_PROXY: ${TRUST_PROXY:-1}
            LOG_LEVEL: ${LOG_LEVEL:-log}
            JWT_SECRET: ${JWT_SECRET:-}
            JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
            JWT_SIGNING_PRIVATE_KEY: ${JWT_SIGNING_PRIVATE_KEY:-}
            JWT_SIGNING_PRIVATE_KEY_FILE: ${JWT_SIGNING_PRIVATE_KEY_FILE:-}
            JWT_SIGNING_PUBLIC_KEY: ${JWT_SIGNING_PUBLIC_KEY:-}
            JWT_SIGNING_PUBLIC_KEY_FILE: ${JWT_SIGNING_PUBLIC_KEY_FILE:-}
            JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:-jwt-k1}
            JWT_SIGNING_PREVIOUS_PUBLIC_KEYS_JSON: ${JWT_SIGNING_PREVIOUS_PUBLIC_KEYS_JSON:-}
            JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
            JWT_ISSUER: ${JWT_ISSUER:-http://localhost:4000}
            JWT_AUDIENCE: ${JWT_AUDIENCE:-filspresso-users}
            AUTH_SESSION_IDLE_TIMEOUT_DAYS: ${AUTH_SESSION_IDLE_TIMEOUT_DAYS:-30}
            # Phase 5.2 (PLAN_NESTJS_SCALING.md). These were documented in .env but
            # never passed in, so the container silently used the hardcoded defaults in
            # passwords.ts and the deployed parameters were not the intended ones.
            # Wired through with the same values the code already defaults to, so this
            # changes nothing until .env says otherwise -- but .env now has effect.
            ARGON2_MEMORY_COST_KIB: ${ARGON2_MEMORY_COST_KIB:-19456}
            ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
            ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
            ARGON2_HASH_LENGTH: ${ARGON2_HASH_LENGTH:-32}
            ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
            ENCRYPTION_KEY_FILE: ${ENCRYPTION_KEY_FILE:-}
            ENCRYPTION_KEY_LEGACY: ${ENCRYPTION_KEY_LEGACY:-}
            ENCRYPTION_KEY_LEGACY_FILE: ${ENCRYPTION_KEY_LEGACY_FILE:-}
            VAULT_KEK: ${VAULT_KEK:-}
            VAULT_KEK_FILE: ${VAULT_KEK_FILE:-}
            VAULT_KEK_ID: ${VAULT_KEK_ID:-kek-local-v1}
            SERVICE_EVENTS_API_KEY: ${SERVICE_EVENTS_API_KEY:-}
            SERVICE_EVENTS_API_KEY_FILE: ${SERVICE_EVENTS_API_KEY_FILE:-}
            SERVICE_ASSERTION_PUBLIC_KEY: ${SERVICE_ASSERTION_PUBLIC_KEY:-}
            SERVICE_ASSERTION_PUBLIC_KEY_FILE: ${SERVICE_ASSERTION_PUBLIC_KEY_FILE:-}
            SERVICE_ASSERTION_ISSUER_ALLOWLIST: ${SERVICE_ASSERTION_ISSUER_ALLOWLIST:-}
            SERVICE_ASSERTION_AUDIENCE: ${SERVICE_ASSERTION_AUDIENCE:-filspresso-backend}
            SERVICE_ASSERTION_ALLOWED_SCOPES: ${SERVICE_ASSERTION_ALLOWED_SCOPES:-service-events:write,service-invoice:render,service-subscriptions:quote,service-crypto:commitment,service-crypto:verify,service-threshold:initiate,service-threshold:approve,service-threshold:execute}
            KEY_USAGE_POLICY_JSON: ${KEY_USAGE_POLICY_JSON:-}
            # The CSRF origin guard runs with NODE_ENV=production, where the
            # localhost fallback is disabled, so every origin the app is served
            # from must be listed explicitly. The Caddy edge origin is appended
            # here so it stays in sync with CADDY_HTTPS_PORT; without it every
            # cookie-authenticated POST through https://localhost:8443 is
            # rejected with 403 and the (fail-closed) prompt limiter reports 503.
            CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000},https://localhost:${CADDY_HTTPS_PORT:-8443}
            FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
            BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:4000}
            GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
            GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
            GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
            APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID:-}
            APPLE_OAUTH_CLIENT_SECRET: ${APPLE_OAUTH_CLIENT_SECRET:-}
            APPLE_OAUTH_REDIRECT_URI: ${APPLE_OAUTH_REDIRECT_URI:-}
            PYTHON_AI_HOST: http://ai:5000
            # Presented by the desktop gateway on every call to the AI service.
            AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
            # The global ceiling, raised for local runs only.
            #
            # This is the dial that a full sweep actually exhausts: a dozen live suites making
            # a few hundred calls each will pass 1200 requests inside a 15-minute window, and
            # the failure that produces is an unexplained 429 partway through a suite. It is
            # the *generic* runaway-client control, so raising it in development costs
            # nothing that the per-route auth budgets are not already providing.
            #
            # The per-route auth limits are deliberately NOT raised here. They are keyed per IP
            # and the check scripts supply a distinct x-forwarded-for each run, so they are not
            # what a sweep exhausts -- and `test:live` proves the register limiter works by
            # deliberately spending it. Loosening them would turn that assertion into a no-op.
            API_RATE_LIMIT_MAX: ${DEV_RATE_LIMIT_GLOBAL_MAX:-100000}
            API_RATE_LIMIT_WINDOW_MS: ${DEV_RATE_LIMIT_GLOBAL_WINDOW_MS:-900000}
            # A moderate raise rather than none. The per-IP register budget of 5 per hour is
            # exhausted by the proxy-path check in test:live, which by design cannot forge a
            # forwarded address (that is what it verifies) and therefore shares this host's
            # real address across runs. 60 leaves room for repeated local runs while still
            # being low enough that the throttler check can spend it -- and that check derives
            # its attempt count from the configured budget rather than assuming a literal.
            RATE_LIMIT_POST_API_AUTH_REGISTER_LIMIT: ${DEV_RATE_LIMIT_REGISTER:-60}
            INVOICE_SERVICE_URL: http://invoice-java:8082
            GO_OPS_URL: http://go-ops:8083
            GO_OPS_API_KEY: ${GO_OPS_API_KEY:-filspresso-ops-key}
            GO_OPS_API_KEY_FILE: ${GO_OPS_API_KEY_FILE:-}
            GO_OPS_TIMEOUT_MS: ${GO_OPS_TIMEOUT_MS:-5000}
            GO_OPS_REQUIRE_TLS: ${GO_OPS_REQUIRE_TLS:-false}
            GO_OPS_REQUIRE_SERVICE_ASSERTION: ${GO_OPS_REQUIRE_SERVICE_ASSERTION:-false}
            GO_OPS_SERVICE_ASSERTION_SCOPE: ${GO_OPS_SERVICE_ASSERTION_SCOPE:-service-events:write}
            INVOICE_REQUIRE_SERVICE_ASSERTION: ${INVOICE_REQUIRE_SERVICE_ASSERTION:-false}
            INVOICE_SERVICE_ASSERTION_SCOPE: ${INVOICE_SERVICE_ASSERTION_SCOPE:-service-invoice:render}
            KOTLIN_SUBSCRIPTIONS_REQUIRE_SERVICE_ASSERTION: ${KOTLIN_SUBSCRIPTIONS_REQUIRE_SERVICE_ASSERTION:-false}
            KOTLIN_SUBSCRIPTIONS_SERVICE_ASSERTION_SCOPE: ${KOTLIN_SUBSCRIPTIONS_SERVICE_ASSERTION_SCOPE:-service-subscriptions:quote}
            GO_OPS_TLS_SERVERNAME: ${GO_OPS_TLS_SERVERNAME:-go-ops}
            GO_OPS_CLIENT_CERT: ${GO_OPS_CLIENT_CERT:-}
            GO_OPS_CLIENT_CERT_FILE: ${GO_OPS_CLIENT_CERT_FILE:-}
            GO_OPS_CLIENT_KEY: ${GO_OPS_CLIENT_KEY:-}
            GO_OPS_CLIENT_KEY_FILE: ${GO_OPS_CLIENT_KEY_FILE:-}
            GO_OPS_CA_CERT: ${GO_OPS_CA_CERT:-}
            GO_OPS_CA_CERT_FILE: ${GO_OPS_CA_CERT_FILE:-}
            INTERNAL_EGRESS_ALLOWLIST: ${INTERNAL_EGRESS_ALLOWLIST:-go-ops,rust-crypto,invoice-java,kotlin-subscriptions,ai,opa,localhost,127.0.0.1,api.frankfurter.app,open.er-api.com,html.duckduckgo.com}
            KOTLIN_SUBSCRIPTIONS_URL: http://kotlin-subscriptions:8084
            RUST_CRYPTO_URL: ${RUST_CRYPTO_URL:-http://rust-crypto:8090}
            RUST_CRYPTO_TIMEOUT_MS: ${RUST_CRYPTO_TIMEOUT_MS:-4000}
            RUST_CRYPTO_REQUIRE_SERVICE_ASSERTION: ${RUST_CRYPTO_REQUIRE_SERVICE_ASSERTION:-false}
            RUST_CRYPTO_SERVICE_ASSERTION_SCOPE_COMMITMENT: ${RUST_CRYPTO_SERVICE_ASSERTION_SCOPE_COMMITMENT:-service-crypto:commitment}
            RUST_CRYPTO_SERVICE_ASSERTION_SCOPE_VERIFY: ${RUST_CRYPTO_SERVICE_ASSERTION_SCOPE_VERIFY:-service-crypto:verify}
            CRYPTO_THRESHOLD_DEFAULT_APPROVALS: ${CRYPTO_THRESHOLD_DEFAULT_APPROVALS:-2}
            OPERATION_REPLAY_REQUIRE_ID: ${OPERATION_REPLAY_REQUIRE_ID:-false}
            OPERATION_REPLAY_TTL_SECONDS: ${OPERATION_REPLAY_TTL_SECONDS:-900}
            CSRF_REQUIRE_ORIGIN_FOR_COOKIE: ${CSRF_REQUIRE_ORIGIN_FOR_COOKIE:-true}
            CSRF_ENFORCE_FETCH_METADATA: ${CSRF_ENFORCE_FETCH_METADATA:-true}
            SERVICE_METRICS_STRICT_DB_ONLY: ${SERVICE_METRICS_STRICT_DB_ONLY:-false}
            ADMIN_HEALTH_URL: ${ADMIN_HEALTH_URL:-}
            OPA_URL: ${OPA_URL:-http://opa:8181/v1/data/filspresso/authz/allow}
            OPA_FAIL_CLOSED: ${OPA_FAIL_CLOSED:-false}
            OPA_TIMEOUT_MS: ${OPA_TIMEOUT_MS:-1500}
            # Session cache (PLAN_NESTJS_SCALING.md Phase 3). The credential is
            # supplied as a Docker secret in the hardened overlay; locally it can
            # be left empty because the base redis service has no requirepass.
            REDIS_URL: ${BACKEND_REDIS_URL:-redis://redis:6379}
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:-}
            SECURITY_OBSERVABILITY_WINDOW_MINUTES: ${SECURITY_OBSERVABILITY_WINDOW_MINUTES:-60}
            SECURITY_OBSERVABILITY_MPC_STALE_MINUTES: ${SECURITY_OBSERVABILITY_MPC_STALE_MINUTES:-30}
            SECURITY_LEDGER_ARCHIVE_ENABLED: ${SECURITY_LEDGER_ARCHIVE_ENABLED:-false}
            SECURITY_LEDGER_ARCHIVE_INTERVAL_MS: ${SECURITY_LEDGER_ARCHIVE_INTERVAL_MS:-3600000}
            SECURITY_ARCHIVE_OLDER_THAN_HOURS: ${SECURITY_ARCHIVE_OLDER_THAN_HOURS:-24}
            SECURITY_ARCHIVE_LIMIT: ${SECURITY_ARCHIVE_LIMIT:-500}
            SECURITY_ARCHIVE_CHAIN_SCOPE: ${SECURITY_ARCHIVE_CHAIN_SCOPE:-}
            SECURITY_ALERT_WEBHOOK_URL: ${SECURITY_ALERT_WEBHOOK_URL:-}
            SECURITY_ALERT_WEBHOOK_TIMEOUT_MS: ${SECURITY_ALERT_WEBHOOK_TIMEOUT_MS:-4000}
            SECURITY_ALERT_DISPATCH_MIN_SEVERITY: ${SECURITY_ALERT_DISPATCH_MIN_SEVERITY:-high}
            SERVICE_ASSERTION_PRIVATE_KEY: ${SERVICE_ASSERTION_PRIVATE_KEY:-}
            SERVICE_ASSERTION_PRIVATE_KEY_FILE: ${SERVICE_ASSERTION_PRIVATE_KEY_FILE:-}
            # Where the desktop client's Windows installer sits.
            #
            # The installer is produced and signed by the desktop project's own CI, and
            # the backend only hands it out. The path is configuration because the
            # deployment decides where the artefact is mounted; a missing file is a
            # 503 ("not published yet"), not a 404.
            DESKTOP_INSTALLER_PATH: ${DESKTOP_INSTALLER_PATH:-/app/downloads/Filspresso.Playground.msi}
        volumes:
            # Mount product images so the backend can read/write images (admin uploads)
            - ./public/images:/public/images
            - ./secrets:/app/secrets:ro
            # The desktop installer, read-only. Mounted from the desktop project's
            # artefacts directory, which is where the release build puts the MSI.
            - ./playground-desktop/artifacts:/app/downloads:ro
        ports:
            # Loopback only, not 0.0.0.0.
            #
            # TRUST_PROXY=1 means Express believes one hop of x-forwarded-for. Caddy is
            # that hop, and Caddy *appends* the address it saw, so a client-supplied
            # prefix is ignored -- correct. But a direct caller on the published port is
            # also "one hop", so it can set the header and be believed. Measured: 13
            # logins with a different forged address each produced 13 distinct
            # auth_login_attempts rows, defeating the escalating login lockout; the same
            # 13 through Caddy produced one row that accumulated.
            #
            # So this port must never be reachable off-host. Caddy reaches the backend
            # over the compose network by service name and does not need this mapping
            # at all -- in production, delete these two lines. Do NOT set TRUST_PROXY=0
            # instead: that re-breaks Caddy, and with it the per-IP rate limiter and the
            # login lockout.
            # Loopback by default. This is still a published port, and a published port is
            # a second entrance to the API that does not go through Caddy -- which means a
            # client reaching it directly is believed when it forges X-Forwarded-For, because
            # TRUST_PROXY=1 trusts the Docker gateway hop in front of it. Narrowed to the
            # host, not closed.
            #
            # To close it, use docker-compose.no-backend-port.yml, which removes the mapping
            # entirely. That needs Next to reach the backend over the compose network, which
            # means running Next in a container rather than on the host as Caddy is
            # configured here.
            - "${BACKEND_BIND_HOST:-127.0.0.1}:4000:4000"
        healthcheck:
            # Must call process.exit() explicitly. The previous form relied on the
            # event loop draining to end the process, so a keep-alive socket could
            # hold it open past the 5s timeout and report
            # "Health check exceeded timeout (5s)" -- exit -1 -- even though
            # /health answered 200 in ~5ms. That is what kept this service
            # permanently `unhealthy`. res.resume() drains the response and
            # process.exit() makes the verdict deterministic.
            test:
                [
                    "CMD-SHELL",
                    'node -e "require(''http'').get(''http://localhost:4000/health'', (r) => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on(''error'', () => process.exit(1))" || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s

    # -------------------------------------------------------------------------
    # 4a. Rust Crypto Service  (crypto control-plane helper)
    # -------------------------------------------------------------------------
    rust_crypto:
        build:
            context: ./rust-crypto-service
            dockerfile: Dockerfile
        container_name: filspresso_rust_crypto
        restart: unless-stopped
        environment:
            PORT: 8090
            RUST_CRYPTO_MAX_BODY_BYTES: ${RUST_CRYPTO_MAX_BODY_BYTES:-65536}
            SERVICE_ASSERTION_REQUIRED: ${RUST_CRYPTO_REQUIRE_SERVICE_ASSERTION:-false}
            SERVICE_ASSERTION_SCOPE_COMMITMENT: ${RUST_CRYPTO_SERVICE_ASSERTION_SCOPE_COMMITMENT:-service-crypto:commitment}
            SERVICE_ASSERTION_SCOPE_VERIFY: ${RUST_CRYPTO_SERVICE_ASSERTION_SCOPE_VERIFY:-service-crypto:verify}
            SERVICE_ASSERTION_PUBLIC_KEY: ${SERVICE_ASSERTION_PUBLIC_KEY:-}
            SERVICE_ASSERTION_PUBLIC_KEY_FILE: ${SERVICE_ASSERTION_PUBLIC_KEY_FILE:-}
            SERVICE_ASSERTION_AUDIENCE: ${SERVICE_ASSERTION_AUDIENCE:-filspresso-backend}
            SERVICE_ASSERTION_ISSUER_ALLOWLIST: ${SERVICE_ASSERTION_ISSUER_ALLOWLIST:-}
            SERVICE_ASSERTION_ENFORCE_REPLAY: ${SERVICE_ASSERTION_ENFORCE_REPLAY:-true}
            SERVICE_ASSERTION_REPLAY_TTL_SECONDS: ${SERVICE_ASSERTION_REPLAY_TTL_SECONDS:-900}
        volumes:
            - ./secrets:/app/secrets:ro
        ports:
            - "8090:8090"
        networks:
            default:
                aliases:
                    - rust-crypto
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 5

    # -------------------------------------------------------------------------
    # 4. Java Invoice Service  (PDF generation)
    # -------------------------------------------------------------------------
    invoice_java:
        build:
            context: ./java-invoice-service
            dockerfile: Dockerfile
        container_name: filspresso_invoice_java
        restart: unless-stopped
        environment:
            INVOICE_LOGO_PATH: /app/public/images/Logo_filspresso_web.png
            SERVICE_ASSERTION_REQUIRED: ${INVOICE_REQUIRE_SERVICE_ASSERTION:-false}
            SERVICE_ASSERTION_SCOPE: ${INVOICE_SERVICE_ASSERTION_SCOPE:-service-invoice:render}
            SERVICE_ASSERTION_PUBLIC_KEY: ${SERVICE_ASSERTION_PUBLIC_KEY:-}
            SERVICE_ASSERTION_PUBLIC_KEY_FILE: ${SERVICE_ASSERTION_PUBLIC_KEY_FILE:-}
            SERVICE_ASSERTION_AUDIENCE: ${SERVICE_ASSERTION_AUDIENCE:-filspresso-backend}
            SERVICE_ASSERTION_ISSUER_ALLOWLIST: ${SERVICE_ASSERTION_ISSUER_ALLOWLIST:-}
        ports:
            - "8082:8082"
        volumes:
            - ./public/images:/app/public/images:ro
            - ./secrets:/app/secrets:ro
        networks:
            default:
                aliases:
                    - invoice-java
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/invoices/health || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 5

    # -------------------------------------------------------------------------
    # 5. Go Operations Service  (events/webhooks/telemetry)
    # -------------------------------------------------------------------------
    go_ops:
        build:
            context: ./go-ops-service
            dockerfile: Dockerfile
        container_name: filspresso_go_ops
        restart: unless-stopped
        depends_on:
            redis:
                condition: service_healthy
        environment:
            PORT: ${GO_OPS_PORT:-8083}
            OPS_API_KEY: ${GO_OPS_API_KEY:-filspresso-ops-key}
            OPS_API_KEY_FILE: ${GO_OPS_API_KEY_FILE:-}
            REDIS_URL: redis:6379
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:-}
            OPS_EVENTS_KEY: ops:events
            GO_OPS_TLS_CERT_FILE: ${GO_OPS_TLS_CERT_FILE:-}
            GO_OPS_TLS_KEY_FILE: ${GO_OPS_TLS_KEY_FILE:-}
            GO_OPS_TLS_CLIENT_CA_FILE: ${GO_OPS_TLS_CLIENT_CA_FILE:-}
            GO_OPS_REQUIRE_MTLS: ${GO_OPS_REQUIRE_MTLS:-false}
            GO_OPS_ALLOWED_SPIFFE_IDS: ${GO_OPS_ALLOWED_SPIFFE_IDS:-}
            GO_OPS_REQUIRE_SERVICE_ASSERTION: ${GO_OPS_REQUIRE_SERVICE_ASSERTION:-false}
            GO_OPS_SERVICE_ASSERTION_SCOPE: ${GO_OPS_SERVICE_ASSERTION_SCOPE:-service-events:write}
            SERVICE_ASSERTION_PUBLIC_KEY: ${SERVICE_ASSERTION_PUBLIC_KEY:-}
            SERVICE_ASSERTION_PUBLIC_KEY_FILE: ${SERVICE_ASSERTION_PUBLIC_KEY_FILE:-}
            SERVICE_ASSERTION_AUDIENCE: ${SERVICE_ASSERTION_AUDIENCE:-filspresso-backend}
            SERVICE_ASSERTION_ISSUER_ALLOWLIST: ${SERVICE_ASSERTION_ISSUER_ALLOWLIST:-}
        volumes:
            - ./secrets:/app/secrets:ro
        ports:
            - "${GO_OPS_PUBLIC_PORT:-8083}:${GO_OPS_PORT:-8083}"
        networks:
            default:
                aliases:
                    - go-ops
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'if [ -n "$$GO_OPS_TLS_CERT_FILE" ]; then wget -qO- --no-check-certificate https://localhost:${GO_OPS_PORT:-8083}/health || exit 1; else wget -qO- http://localhost:${GO_OPS_PORT:-8083}/health || exit 1; fi',
                ]
            interval: 20s
            timeout: 5s
            retries: 5

    # -------------------------------------------------------------------------
    # 6. Kotlin Subscription Service  (pricing/reconciliation)
    # -------------------------------------------------------------------------
    kotlin_subscriptions:
        build:
            context: ./kotlin-subscription-service
            dockerfile: Dockerfile
        container_name: filspresso_kotlin_subscriptions
        restart: unless-stopped
        environment:
            SERVICE_ASSERTION_REQUIRED: ${KOTLIN_SUBSCRIPTIONS_REQUIRE_SERVICE_ASSERTION:-false}
            SERVICE_ASSERTION_SCOPE: ${KOTLIN_SUBSCRIPTIONS_SERVICE_ASSERTION_SCOPE:-service-subscriptions:quote}
            SERVICE_ASSERTION_PUBLIC_KEY: ${SERVICE_ASSERTION_PUBLIC_KEY:-}
            SERVICE_ASSERTION_PUBLIC_KEY_FILE: ${SERVICE_ASSERTION_PUBLIC_KEY_FILE:-}
            SERVICE_ASSERTION_AUDIENCE: ${SERVICE_ASSERTION_AUDIENCE:-filspresso-backend}
            SERVICE_ASSERTION_ISSUER_ALLOWLIST: ${SERVICE_ASSERTION_ISSUER_ALLOWLIST:-}
        volumes:
            - ./secrets:/app/secrets:ro
        ports:
            - "8084:8084"
        networks:
            default:
                aliases:
                    - kotlin-subscriptions
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:8084/api/subscriptions/health || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 5

    # -------------------------------------------------------------------------
    # 7. AI API  (FastAPI gateway for chat, molecules, IoT)
    # -------------------------------------------------------------------------
    ai:
        build:
            context: .
            dockerfile: Dockerfile.ai
        container_name: filspresso_ai
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            llama_minilm:
                condition: service_started
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: ${DB_NAME:-filspresso}
            DB_USER: ${DB_USER:-filspresso_user}
            DB_PASSWORD: ${DB_PASSWORD:-}
            DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
            AI_DB_USER: ${AI_DB_USER:-}
            AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
            AI_DB_PASSWORD_FILE: ${AI_DB_PASSWORD_FILE:-}
            STRICT_SERVICE_DB_CREDENTIALS: ${STRICT_SERVICE_DB_CREDENTIALS:-false}
            PYTHON_AI_PORT: 5000
            LLAMA_CPP_MODEL: ${LLAMA_CPP_MODEL:-LFM2.5-230M-Q4_K_M.gguf}
            LLAMA_CPP_VISION_MODEL: ${LLAMA_CPP_VISION_MODEL:-LFM2.5-VL-450M-Q4_K_M.gguf}
            LLAMA_CPP_AUDIO_MODEL: ${LLAMA_CPP_AUDIO_MODEL:-LFM2.5-Audio-1.5B-Q4_0.gguf}
            # All nine chat GGUFs are served by the single router. They therefore
            # share one endpoint, which is why the concurrency gate keys on the
            # MODEL rather than on the URL: one URL no longer means one slot.
            LLAMA_CPP_CHAT_BASE_URL: ${LLAMA_CPP_CHAT_BASE_URL:-http://llama-lfm:8080}
            LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://llama-lfm:8080}
            LLAMA_CPP_MODELS_MAX: ${LLAMA_CPP_MODELS_MAX:-1}
            # Retrieval embedder only; not a user-selectable chat model. Kept on
            # its own server so it stays resident for the semantic-retrieval path.
            LLAMA_CPP_MINILM_BASE_URL: ${LLAMA_CPP_MINILM_BASE_URL:-http://llama-minilm:8080}
            LLAMA_CPP_TIMEOUT_SECONDS: ${LLAMA_CPP_TIMEOUT_SECONDS:-180}
            LLAMA_CPP_WARMUP_ON_STARTUP: ${LLAMA_CPP_WARMUP_ON_STARTUP:-true}
            LLAMA_COFFEE_TIMEOUT_SECONDS: ${LLAMA_COFFEE_TIMEOUT_SECONDS:-300}
            LLAMA_CHEMISTRY_TIMEOUT_SECONDS: ${LLAMA_CHEMISTRY_TIMEOUT_SECONDS:-300}
            MOLECULE_IMAGE_TIMEOUT_SECONDS: ${MOLECULE_IMAGE_TIMEOUT_SECONDS:-300}
            LLAMA_COFFEE_MAX_NEW_TOKENS: ${LLAMA_COFFEE_MAX_NEW_TOKENS:-320}
            LLAMA_CHEMISTRY_MAX_NEW_TOKENS: ${LLAMA_CHEMISTRY_MAX_NEW_TOKENS:-384}
            # Phase D backpressure. Every llama.cpp container runs without
            # --parallel, so each has exactly one slot: keep concurrency at 1 and
            # let a burst queue for AI_QUEUE_WAIT_SECONDS before degrading.
            # Raising concurrency above 1 requires adding --parallel to the
            # llama.cpp services, otherwise requests are refused upstream.
            AI_MAX_CONCURRENCY_PER_MODEL: ${AI_MAX_CONCURRENCY_PER_MODEL:-1}
            AI_QUEUE_WAIT_SECONDS: ${AI_QUEUE_WAIT_SECONDS:-20}
            AI_WARMUP_MAX_CONCURRENCY: ${AI_WARMUP_MAX_CONCURRENCY:-1}
            # rdkit is CPU/memory-bound and independent of llama.cpp; the limit
            # bounds resident conformers rather than throughput.
            AI_MAX_CONCURRENCY_MOLECULE: ${AI_MAX_CONCURRENCY_MOLECULE:-2}
            AI_MOLECULE_QUEUE_WAIT_SECONDS: ${AI_MOLECULE_QUEUE_WAIT_SECONDS:-10}
            # Shared secret for the model routes. Unset means open, which is why the service
            # prints a warning on boot and why the port is bound to loopback by default.
            AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
        ports:
            # Loopback only, like the backend. The Next server runs on the host in the
            # current topology and still reaches this at localhost:5000, but nothing off the
            # machine can. Publishing it on all interfaces meant any local process -- and, on a
            # routable host, anything that could reach the port -- could generate unmetered.
            - "${AI_BIND_HOST:-127.0.0.1}:5000:5000"
        volumes:
            # Persist generated user icons
            - ./public/images/icons:/app/public/images/icons
            - ./secrets:/app/secrets:ro
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
            interval: 20s
            timeout: 10s
            retries: 5

    # -------------------------------------------------------------------------
    # 8. llama.cpp runtimes  (one container per GGUF model)
    # NOTE: all model containers listen on internal port 8080; this is safe
    # because each container has its own network namespace.
    # -------------------------------------------------------------------------
    llama_minilm:
        image: ${AI_MODELS_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
        container_name: filspresso_llama_minilm
        restart: unless-stopped
        gpus: all
        environment:
            NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
            NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
        command:
            - -m
            - /models/MiniLM-L6-v2.gguf
            - --alias
            - MiniLM-L6-v2.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -ngl
            - "99"
            - -c
            - "4096"
        expose:
            - "8080"
        volumes:
            - ./models/model:/models:ro
        networks:
            default:
                aliases:
                    - llama-minilm
        healthcheck:
            test: ["CMD-SHELL", "ps -o comm= 1 | grep -q llama-server"]
            interval: 20s
            timeout: 10s
            retries: 5

    # Single llama.cpp server in router mode.
    #
    # One model is resident at a time (--models-max 1); requesting a different one
    # LRU-evicts the current model. This is the right shape for a single 4 GB GPU:
    # holding all nine models at once exhausted VRAM (3741/4096 MiB) and made a
    # 2.6B first token take over 240s, versus 0.2s with the whole GPU to itself.
    #
    # --models-preset (not --models-dir) is deliberate: models/ also holds
    # mmproj-*.gguf and vocoder-*.gguf, and auto-discovery would register a
    # projector as a loadable model. The preset file names exactly the nine chat
    # GGUFs and their mmproj pairings.
    #
    # -np 4 gives the server four slots. That is *capacity*: the gateway's
    # concurrency gate admits 4 concurrent requests for LFM2.5-230M (measured
    # faster than serving them serially, thanks to continuous batching) and 1 for
    # every other model, and serialises requests for *different* models so a swap
    # never evicts a model mid-generation.
    llama_lfm:
        image: ${AI_MODELS_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
        container_name: filspresso_llama_lfm
        restart: unless-stopped
        gpus: all
        environment:
            NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
            NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
        command:
            - --models-preset
            - /app/router-presets.ini
            - --models-max
            - "1"
            - --models-autoload
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -np
            - "4"
            - -ngl
            - "999"
            # llama.cpp defaults to half the cores; with only one model resident
            # there is nothing to share them with, so use them all.
            - -t
            - "8"
            - -tb
            - "8"
        expose:
            - "8080"
        volumes:
            - ./models/model:/models:ro
            # Mounted separately rather than living in models/model, which is
            # the weights directory.
            - ./models/router-presets.ini:/app/router-presets.ini:ro
        networks:
            default:
                aliases:
                    - llama-lfm
                    - llama-cpp
        healthcheck:
            test: ["CMD-SHELL", "ps -o comm= 1 | grep -q llama-server"]
            interval: 20s
            timeout: 10s
            retries: 5

    # One llama.cpp service per user-facing GGUF. Each server runs without
    # --parallel, so every one of these has exactly ONE slot: the AI gateway's
    # concurrency gate (AI_MAX_CONCURRENCY_PER_MODEL=1) keys on these aliases so
    # two routes aimed at the same service contend instead of overloading it.
    # llama_minilm above is retained only as the coffee_facts retrieval embedder.

    caddy:
        image: caddy:2.8-alpine
        container_name: filspresso_caddy
        restart: unless-stopped
        depends_on:
            backend:
                condition: service_started
        environment:
            # Bare host:port on purpose - see the note at the top of ./Caddyfile.
            NEXT_UPSTREAM: ${NEXT_UPSTREAM:-host.docker.internal:3000}
            # Only read by ./Caddyfile.acme. Harmless with the local config.
            CADDY_DOMAIN: ${CADDY_DOMAIN:-}
            CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
        ports:
            - "${CADDY_HTTPS_PORT:-8443}:8443"
        volumes:
            # CADDYFILE selects the config: ./Caddyfile for local (mkcert), or
            # ./Caddyfile.acme for a real deployment (Let's Encrypt over ACME).
            - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
            # mkcert leaf certificate, read-only. Caddy runs as root in the container
            # but the key must not be writable by it.
            - ./secrets/tls:/certs:ro
            - caddy_data:/data
            - caddy_config:/config
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8443/ >/dev/null 2>&1 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    caddy_data:
        driver: local
    caddy_config:
        driver: local
