services:
    # PostgreSQL database with pgvector and rdkit
    postgres:
        build:
            context: .
            dockerfile: Dockerfile.db
        container_name: filspresso_next_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-filspresso}
            POSTGRES_USER: ${DB_USER:-filspresso_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-filspresso_secure_2024}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./express-api/data:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-filspresso_user} -d ${DB_NAME:-filspresso}"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
        driver: local
