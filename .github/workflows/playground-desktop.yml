name: playground-desktop

# The desktop client is built on Windows only, and not on `dotnet build`.
#
# The Windows App SDK's PRI generation targets are not in the .NET CLI's copy of MSBuild, so
# `dotnet build` fails with MSB4062 on a project that is otherwise perfectly fine. Building it
# needs MSBuild from Visual Studio. That is also why this workflow cannot be a container.

on:
  push:
    branches: [main]
    paths:
      - "playground-desktop/**"
      - ".github/workflows/playground-desktop.yml"
  pull_request:
    paths:
      - "playground-desktop/**"
      - ".github/workflows/playground-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the commit
        # The MSI records a version, and "0.1.0" for every build makes an installed copy
        # impossible to tell apart from the next one.
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 8)
          "GIT_COMMIT=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # The Windows App SDK and the XAML compiler need the Windows SDK and the MSBuild
      # components that come with Visual Studio. windows-2022 has them; a bare SDK image does
      # not, and installing them here would be slower than using the image that has them.
      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $path) { throw "MSBuild not found; the Windows App SDK cannot be built without it." }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore playground-desktop/Filspresso.Desktop.sln

      - name: Build and test the libraries
        # The main solution deliberately excludes the WinUI app, because the CLI's MSBuild
        # cannot run the Windows App SDK's PRI targets. Building it here would fail the whole
        # step, so the app is a separate solution and a separate step below.
        run: |
          dotnet build playground-desktop/Filspresso.Desktop.sln -c Release -p:Platform=x64
          dotnet test playground-desktop/Filspresso.Desktop.sln -c Release --no-build

      - name: Build the WinUI application
        run: >
          & '${{ steps.msbuild.outputs.path }}'
          playground-desktop\src\Filspresso.App\Filspresso.App.csproj
          -restore -p:Configuration=Release -p:Platform=x64 -v:m -nologo

      - name: Publish the application
        run: >
          & '${{ steps.msbuild.outputs.path }}'
          playground-desktop\src\Filspresso.App\Filspresso.App.csproj
          -t:Publish -p:Configuration=Release -p:Platform=x64 -p:PublishDir=playground-desktop\artifacts\publish\ -v:m -nologo

      - name: Build the installer
        # Unsigned. The signing step below is a separate, secret-gated job; this one proves the
        # MSI is produced and structurally valid without needing a certificate.
        run: |
          wix build `
            playground-desktop\installer\Filspresso.Installer.wxs `
            -arch x64 `
            -d AppPublishDir="$(Resolve-Path playground-desktop\artifacts\publish)" `
            -d ProductVersion=0.1.0 `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -o playground-desktop\artifacts\Filspresso.Playground.msi

      - name: Verify the MSI produced a package
        shell: pwsh
        run: |
          $msi = "playground-desktop\artifacts\Filspresso.Playground.msi"
          if (-not (Test-Path $msi)) { throw "the installer step produced no MSI" }
          $size = (Get-Item $msi).Length
          if ($size -lt 1MB) { throw "MSI is only $size bytes; the application files are missing from it" }
          Write-Output "MSI: $size bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: filspresso-playground-msi
          path: playground-desktop/artifacts/Filspresso.Playground.msi
          retention-days: 30

  sign:
    # Signing is gated on a real certificate existing. Until one does, this job sits idle and
    # the unsigned artifact above is what the team tests with -- which is a known, stated gap
    # rather than a silent one.
    if: ${{ secrets.WINDOWS_SIGNING_PFX != '' }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download the built MSI
        uses: actions/download-artifact@v4
        with:
          name: filspresso-playground-msi
          path: artifacts

      - name: Sign
        shell: pwsh
        run: |
          $pfx = [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_SIGNING_PFX }}"))
          $password = ConvertTo-SecureString "${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}" -AsPlainText -Force
          # Timestamped, so the signature outlives the certificate's own validity window. An
          # installer without a timestamp stops verifying the day the certificate expires,
          # which on a desktop app can be years after it was first published.
          & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $password artifacts\Filspresso.Playground.msi
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
          & signtool verify /pa artifacts\Filspresso.Playground.msi
          if ($LASTEXITCODE -ne 0) { throw "the signed MSI does not verify" }

      - uses: actions/upload-artifact@v4
        with:
          name: filspresso-playground-msi-signed
          path: artifacts/Filspresso.Playground.msi
          retention-days: 90