[package]
name = "filspresso_titan_wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Titan V0.74 client-side commitment and witness pre-processing helpers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
sha3 = "0.10"
hex = "0.4"
serde_json = "1.0"
