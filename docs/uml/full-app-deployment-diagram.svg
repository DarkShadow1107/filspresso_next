<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 1360 760" role="img" aria-labelledby="title desc">
  <title id="title">Filspresso Deployment Diagram</title>
  <desc id="desc">Deployment diagram of browser, Next.js, Express, Python AI, PostgreSQL and operations nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f7f4"/>
      <stop offset="100%" stop-color="#e5efe9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5d4c"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #6a9b88; stroke-width: 2; rx: 14; }
      .db { fill: #f9fffc; stroke: #4d7f6c; stroke-width: 2.2; }
      .label { font: 600 15px Segoe UI, Arial, sans-serif; fill: #15372b; }
      .title { font: 700 30px Segoe UI, Arial, sans-serif; fill: #1a3f31; }
      .sub { font: 400 14px Segoe UI, Arial, sans-serif; fill: #3b5f52; }
      .link { stroke: #2f5d4c; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .zone { fill: #ffffffaa; stroke: #9ec0b3; stroke-width: 1.6; rx: 20; }
      .zoneLabel { font: 700 17px Segoe UI, Arial, sans-serif; fill: #295645; }
    </style>
  </defs>

  <rect x="0" y="0" width="1360" height="760" fill="url(#bg)"/>
  <text x="50" y="62" class="title">Filspresso Runtime Deployment Diagram</text>
  <text x="50" y="88" class="sub">Container and service communication in local/cloud environments</text>

  <rect class="zone" x="40" y="120" width="1240" height="600"/>
  <text x="60" y="152" class="zoneLabel">Application Runtime</text>

  <rect class="node" x="90" y="280" width="190" height="86"/>
  <text x="120" y="332" class="label">User Browser</text>

  <rect class="node" x="360" y="180" width="240" height="96"/>
  <text x="388" y="220" class="label">Next.js Service</text>
  <text x="388" y="246" class="label">Port 3000</text>

  <rect class="node" x="360" y="390" width="240" height="96"/>
  <text x="388" y="430" class="label">Express API</text>
  <text x="388" y="456" class="label">Port 4000</text>

  <rect class="node" x="700" y="180" width="250" height="96"/>
  <text x="728" y="220" class="label">Python AI Service</text>
  <text x="728" y="246" class="label">Port 5000</text>

  <ellipse class="db" cx="820" cy="455" rx="140" ry="70"/>
  <text x="748" y="448" class="label">PostgreSQL</text>
  <text x="768" y="474" class="label">Port 5432</text>

  <rect class="node" x="1030" y="200" width="210" height="86"/>
  <text x="1058" y="240" class="label">Admin Scripts</text>

  <rect class="node" x="1030" y="380" width="210" height="106"/>
  <text x="1058" y="422" class="label">Health Checks</text>
  <text x="1058" y="448" class="label">Docker/Orchestration</text>

  <path class="link" d="M280 323 L360 228"/>
  <path class="link" d="M280 323 L360 438"/>
  <path class="link" d="M600 228 L700 228"/>
  <path class="link" d="M600 438 L680 438"/>
  <path class="link" d="M950 228 L1030 243"/>
  <path class="link" d="M1120 286 L600 438"/>
  <path class="link" d="M600 438 L680 455"/>
  <path class="link" d="M700 238 L680 430"/>
  <path class="link" d="M1120 433 L600 438"/>
  <path class="link" d="M1120 433 L950 228"/>
  <path class="link" d="M1120 433 L960 455"/>
</svg>
