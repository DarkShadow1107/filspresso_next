; Explicit model list for the llama.cpp router server.
;
; Why this file exists instead of relying on --models-dir auto-discovery:
; models/model also holds mmproj-*.gguf and vocoder-*.gguf. The router scans for
; GGUF files and would happily register a projector as a standalone model, so the
; catalog is declared here and auto-discovery is never relied on.
;
; [*] applies to every model below. --models-max 1 in the compose command means
; exactly one model stays resident: requesting a different one LRU-evicts the
; current model, which is the intended behaviour for a single 4 GB GPU.
;
; parallel/slots: the server is started with -np 4 so LFM2.5-230M can serve four
; concurrent users (measured faster than serving them serially, thanks to
; continuous batching). Per-model admission is still enforced by the gateway's
; concurrency gate, which allows 4 for the 230M and 1 for everything else -- the
; slot count here is capacity, not policy.

[*]
n-gpu-layers   = 999
mmap           = 1
kv-unified     = 1
flash-attn     = on
fit            = on

[LFM2.5-230M-Q4_K_M]
model       = /models/LFM2.5-230M-Q4_K_M.gguf
ctx-size    = 8192

[LFM2.5-350M-Q8_0]
model       = /models/LFM2.5-350M-Q8_0.gguf
ctx-size    = 8192

[LFM2.5-1.2B-Instruct-Q4_K_M]
model       = /models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
ctx-size    = 16384

[LFM2.5-1.2B-Thinking-Q4_K_M]
model       = /models/LFM2.5-1.2B-Thinking-Q4_K_M.gguf
ctx-size    = 16384

[LFM2.5-2.6B-Q4_0]
model       = /models/LFM2.5-2.6B-Q4_0.gguf
ctx-size    = 32768

; Mixture-of-experts: only ~1B parameters are active per token, so decode is much
; faster than the 4.9 GB file size suggests. --cpu-moe keeps the expert tensors in
; system RAM, which is the scarce resource here (4 GB VRAM), and measured faster
; for this model than a full GPU offload.
[LFM2.5-8B-A1B-Q4_K_M]
model       = /models/LFM2.5-8B-A1B-Q4_K_M.gguf
ctx-size    = 16384
cpu-moe     = on

[LFM2.5-VL-450M-Q4_K_M]
model       = /models/LFM2.5-VL-450M-Q4_K_M.gguf
mmproj      = /models/mmproj-LFM2.5-VL-450m-Q8_0.gguf
ctx-size    = 16384

[LFM2.5-VL-3B-Q4_K_M]
model       = /models/LFM2.5-VL-3B-Q4_K_M.gguf
mmproj      = /models/mmproj-LFM2.5-VL-3B-Q8_0.gguf
ctx-size    = 16384

[LFM2.5-Audio-1.5B-Q4_0]
model       = /models/LFM2.5-Audio-1.5B-Q4_0.gguf
mmproj      = /models/mmproj-LFM2.5-Audio-1.5B-Q4_0.gguf
ctx-size    = 16384
