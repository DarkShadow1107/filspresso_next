; Explicit model list for the llama.cpp router server.
;
; Why this file exists instead of relying on --models-dir auto-discovery:
; models/model also holds mmproj-*.gguf and vocoder-*.gguf. The router scans for
; GGUF files and would happily register a projector as a standalone model, so the
; catalog is declared here and auto-discovery is never relied on.
;
; [*] applies to every model below. --models-max 1 in the compose command means
; exactly one model stays resident: requesting a different one LRU-evicts the
; current model, which is the intended behaviour for a single 4 GB GPU.
;
; parallel/slots: the server is started with -np 4 so LFM2.5-230M can serve four
; concurrent users (measured faster than serving them serially, thanks to
; continuous batching). Per-model admission is still enforced by the gateway's
; concurrency gate, which allows 4 for the 230M and 1 for everything else -- the
; slot count here is capacity, not policy.

[*]
n-gpu-layers   = 999
mmap           = 1
kv-unified     = 1
flash-attn     = on
fit            = on

; The Free plan's model. Retained at its native 128K window.
[LFM2.5-230M-Q4_K_M]
model       = /models/LFM2.5-230M-Q4_K_M.gguf
ctx-size    = 131072

; ---- LFM 3 family: 256K context -------------------------------------------
;
; All LFM 3 entries keep the KV cache in system RAM (kv-offload = 0). A 256K KV
; cache plus the weights leaves insufficient compute headroom on the 4 GiB GPU,
; and the 2.6B crash showed that an overflowing KV cache can take the whole
; generation down rather than degrade. Moving the cache to RAM costs some decode
; speed but keeps the full window usable.

[LFM3-1.7B-Q4_K_M]
model       = /models/LFM3-1.7B-Q4_K_M.gguf
ctx-size    = 262144
kv-offload  = 0

[LFM3-VL-2B-Q4_K_M]
model       = /models/LFM3-VL-2B-Q4_K_M.gguf
mmproj      = /models/mmproj-LFM3-VL-2B-Q8_0.gguf
ctx-size    = 262144
kv-offload  = 0

[LFM3-Audio-2B-Q4_K_M]
model       = /models/LFM3-Audio-2B-Q4_K_M.gguf
mmproj      = /models/mmproj-LFM3-Audio-2B-Q4_K_M.gguf
ctx-size    = 262144
kv-offload  = 0

[LFM3-Omni-2B-Q4_K_M]
model       = /models/LFM3-Omni-2B-Q4_K_M.gguf
mmproj      = /models/mmproj-LFM3-Omni-2B-Q4_K_M.gguf
ctx-size    = 262144
kv-offload  = 0
